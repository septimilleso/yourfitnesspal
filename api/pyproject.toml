[project]
name = "yourfitnesspal-api"
version = "0.1.0"
description = "YourFitnessPal API - personal food diary backed by OpenFoodFacts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=43",
    "mcp>=2.2,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole test session: the async engine's connection
# pool is a module-level singleton, and asyncpg connections are bound to the
# event loop they were opened on. With the default per-test loop, tests
# sharing that pool across loops fail with asyncpg's "another operation is
# in progress" (or "attached to a different loop") once enough tests run
# together. Both options are needed: fixture_loop_scope covers async
# fixtures (e.g. the `db` fixture), test_loop_scope covers the test
# coroutines themselves.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's dependency-injection pattern requires `Depends(...)` as an
# argument default -- that's not the mutable-default-argument footgun this
# rule targets.
ignore = ["B008"]
